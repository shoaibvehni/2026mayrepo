name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download hand landmarker model
        run: |
          Invoke-WebRequest -Uri "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task" -OutFile "hand_landmarker.task"
        shell: pwsh

      - name: Build executable
        run: |
          pyinstaller --onedir --name "LivePuzzle" --windowed --add-data "src;src" --add-data "hand_landmarker.task;." --hidden-import=mediapipe --hidden-import=cv2 --hidden-import=pygame --hidden-import=numpy --collect-all mediapipe run.py

      - name: Create zip
        run: |
          Compress-Archive -Path "dist\LivePuzzle\*" -DestinationPath "LivePuzzle-windows.zip"
        shell: pwsh

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-standalone
          files: LivePuzzle-windows.zip
